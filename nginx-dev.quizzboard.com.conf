# ==============================================================================
# CONFIGURATION NGINX HÔTE POUR dev.quizzboard.com
# Emplacement sur le serveur : /etc/nginx/sites-available/dev.quizzboard.com
# ==============================================================================

server {
    listen 80;
    server_name dev.quizzboard.com;

    # Taille max pour l'upload d'images et de fichiers
    client_max_body_size 50M;

    # 1. API REST Spring Boot (Conteneur backend-dev sur 127.0.0.1:8081)
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 2. WebSockets STOMP pour les sessions de quiz en direct
    location /ws-live/ {
        proxy_pass http://127.0.0.1:8081/api/v1/ws-live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Frontend Angular SPA (Conteneur client-dev sur 127.0.0.1:4201)
    location / {
        proxy_pass http://127.0.0.1:4201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
