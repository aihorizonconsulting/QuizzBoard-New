# ==============================================================================
# CONFIGURATION NGINX HOTE POUR quizzboard.com
# Emplacement sur le serveur : /etc/nginx/sites-available/quizzboard.com
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name quizzboard.com www.quizzboard.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quizzboard.com www.quizzboard.com;

    ssl_certificate /etc/letsencrypt/live/quizzboard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quizzboard.com/privkey.pem;

    client_max_body_size 50M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://quizzboard.com https://www.quizzboard.com https://app.paydunya.com https://paydunya.com https://accounts.google.com; frame-src 'self' https://accounts.google.com https://app.paydunya.com https://paydunya.com; media-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://app.paydunya.com https://paydunya.com" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
