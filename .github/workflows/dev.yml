name: Deploy Dev (dev.quizzboard.com)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Déploiement Environnement DEV
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # ÉTAPE 1 : TEST DE CONNEXION SSH
      # ------------------------------------------------------------------------
      - name: 1. 🔍 Tester la connexion SSH avec le serveur
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: dev.quizzboard.com
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.DEV_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "===================================================="
            echo "✅ ÉTAPE 1 : Connexion SSH établie avec succès !"
            echo "Serveur : $(hostname)"
            echo "Utilisateur : $(whoami)"
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 2 : SYNCHRONISATION DU CODE GIT (BRANCHE DEVELOP)
      # ------------------------------------------------------------------------
      - name: 2. 📥 Mettre à jour le code Git (branche develop)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: dev.quizzboard.com
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.DEV_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "===================================================="
            echo "📥 ÉTAPE 2 : Récupération du dernier code..."
            cd /var/www/QuizzBoard-New
            git fetch origin develop
            git checkout -f develop
            git reset --hard origin/develop
            echo "Dernier commit déployé : $(git log -1 --oneline)"
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 3 : VÉRIFICATION DU FICHIER D'ENVIRONNEMENT DEV
      # ------------------------------------------------------------------------
      - name: 3. ⚙️ Vérifier la configuration (.env.dev)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: dev.quizzboard.com
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.DEV_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "===================================================="
            echo "⚙️ ÉTAPE 3 : Vérification du fichier d'environnement..."
            cd /var/www/QuizzBoard-New
            if [ ! -f .env.dev ]; then
              echo "⚠️ Fichier .env.dev introuvable, création automatique depuis le template..."
              cp .env.dev.example .env.dev
            fi
            echo "✅ Fichier .env.dev opérationnel."
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 4 : RECONSTRUCTION ET DÉMARRAGE DES CONTENEURS DEV
      # ------------------------------------------------------------------------
      - name: 4. 🐳 Reconstruire et démarrer les conteneurs DEV (Docker Compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: dev.quizzboard.com
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.DEV_SERVER_PORT || 22 }}
          timeout: 30m
          command_timeout: 30m
          script_stop: true
          script: |
            echo "===================================================="
            echo "🐳 ÉTAPE 4 : Build et lancement Docker Compose..."
            cd /var/www/QuizzBoard-New
            docker compose -f docker-compose.dev.yml up -d --build
            echo "✅ Conteneurs DEV reconstruits et démarrés."
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 5 : CONTRÔLE DE SANTÉ DES SERVICES DEV
      # ------------------------------------------------------------------------
      - name: 5. 🩺 Vérifier l'état et la santé des services DEV
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: dev.quizzboard.com
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.DEV_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "===================================================="
            echo "🩺 ÉTAPE 5 : Statut des conteneurs en cours d'exécution..."
            cd /var/www/QuizzBoard-New
            sleep 10
            docker compose -f docker-compose.dev.yml ps
            echo "--- Derniers logs backend-dev ---"
            docker compose -f docker-compose.dev.yml logs --tail=40 backend-dev
            echo "✅ Déploiement DEV actif sur https://dev.quizzboard.com"
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 6 : NETTOYAGE DES IMAGES DOCKER ORPHELINES
      # ------------------------------------------------------------------------
      - name: 6. 🧹 Nettoyer les images Docker orphelines
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: dev.quizzboard.com
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.DEV_SERVER_PORT || 22 }}
          script: |
            echo "===================================================="
            echo "🧹 ÉTAPE 6 : Nettoyage du cache et des images obsolètes..."
            docker image prune -f
            echo "✅ Espace disque optimisé."
            echo "===================================================="
