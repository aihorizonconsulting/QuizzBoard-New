name: Deploy Prod (quizzboard.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "===================================================="
            echo "🚀 DÉPLOIEMENT AUTOMATIQUE - BRANCHE MAIN (PROD)"
            echo "===================================================="
            cd /var/www/QuizzBoard-New
            
            echo "📥 Récupération des dernières modifications sur main..."
            git fetch origin main
            git checkout main
            git pull origin main
            
            echo "🐳 Lancement et reconstruction des conteneurs PRODUCTION..."
            docker compose -f docker-compose.prod.yml up -d --build
            
            echo "🧹 Nettoyage des images Docker orphelines..."
            docker image prune -f
            
            echo "✅ DÉPLOIEMENT PROD TERMINÉ SUR https://quizzboard.com"
            echo "===================================================="
