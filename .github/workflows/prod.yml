name: Deploy Production (quizzboard.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Déploiement Environnement PRODUCTION
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # ÉTAPE 1 : TEST DE CONNEXION SSH
      # ------------------------------------------------------------------------
      - name: 1. 🔍 Tester la connexion SSH avec le serveur
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "===================================================="
            echo "✅ ÉTAPE 1 : Connexion SSH établie avec succès !"
            echo "Serveur : $(hostname)"
            echo "Utilisateur : $(whoami)"
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 2 : SYNCHRONISATION DU CODE GIT (BRANCHE MAIN)
      # ------------------------------------------------------------------------
      - name: 2. 📥 Mettre à jour le code Git (branche main)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "===================================================="
            echo "📥 ÉTAPE 2 : Récupération du code de production..."
            cd /var/www/QuizzBoard-New
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            echo "Dernier commit déployé : $(git log -1 --oneline)"
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 3 : VÉRIFICATION DU FICHIER D'ENVIRONNEMENT PROD
      # ------------------------------------------------------------------------
      - name: 3. ⚙️ Vérifier la configuration (.env.prod)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "===================================================="
            echo "⚙️ ÉTAPE 3 : Vérification de la configuration prod..."
            cd /var/www/QuizzBoard-New
            if [ ! -f .env.prod ]; then
              echo "⚠️ Fichier .env.prod introuvable, création automatique depuis le template..."
              cp .env.prod.example .env.prod
            fi
            echo "✅ Fichier .env.prod opérationnel."
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 4 : RECONSTRUCTION ET DÉMARRAGE DES CONTENEURS PROD
      # ------------------------------------------------------------------------
      - name: 4. 🐳 Reconstruire et démarrer les conteneurs PRODUCTION (Docker Compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          script_stop: true
          script: |
            echo "===================================================="
            echo "🐳 ÉTAPE 4 : Build et lancement Docker Compose PROD..."
            cd /var/www/QuizzBoard-New
            docker compose -f docker-compose.prod.yml up -d --build
            echo "✅ Conteneurs PRODUCTION reconstruits et démarrés."
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 5 : CONTRÔLE DE SANTÉ DES SERVICES PROD
      # ------------------------------------------------------------------------
      - name: 5. 🌐 Installer la configuration Nginx PRODUCTION
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "===================================================="
            echo "🌐 ÉTAPE 5 : Configuration Nginx pour quizzboard.com..."
            cd /var/www/QuizzBoard-New
            if [ ! -f /etc/letsencrypt/live/quizzboard.com/fullchain.pem ]; then
              echo "❌ Certificat SSL introuvable : /etc/letsencrypt/live/quizzboard.com/fullchain.pem"
              exit 1
            fi
            cp nginx-quizzboard.com.conf /etc/nginx/sites-available/quizzboard.com
            ln -sf /etc/nginx/sites-available/quizzboard.com /etc/nginx/sites-enabled/quizzboard.com
            nginx -t
            systemctl reload nginx || nginx -s reload
            echo "✅ Nginx PRODUCTION pointe vers les conteneurs QuizzBoard."
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 6 : CONTRÔLE DE SANTÉ DES SERVICES PROD
      # ------------------------------------------------------------------------
      - name: 6. 🩺 Vérifier l'état et la santé des services PRODUCTION
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "===================================================="
            echo "🩺 ÉTAPE 6 : Statut des conteneurs de PRODUCTION..."
            cd /var/www/QuizzBoard-New
            echo "Attente de l'API backend PRODUCTION..."
            for attempt in $(seq 1 60); do
              if curl -fsS --max-time 5 http://127.0.0.1:8080/api/v1/subscriptions/settings >/dev/null; then
                echo "✅ API backend PRODUCTION prête après ${attempt} tentative(s)."
                break
              fi

              if [ "$attempt" -eq 60 ]; then
                echo "❌ API backend PRODUCTION indisponible après 10 minutes."
                docker compose -f docker-compose.prod.yml ps
                docker compose -f docker-compose.prod.yml logs --tail=160 backend-prod
                exit 1
              fi

              sleep 10
            done
            docker compose -f docker-compose.prod.yml ps
            echo "Test public quizzboard.com..."
            curl -fsS --max-time 10 https://quizzboard.com/api/v1/subscriptions/settings >/dev/null
            echo "✅ Déploiement PRODUCTION actif sur https://quizzboard.com"
            echo "===================================================="

      # ------------------------------------------------------------------------
      # ÉTAPE 7 : NETTOYAGE DES IMAGES DOCKER ORPHELINES
      # ------------------------------------------------------------------------
      - name: 7. 🧹 Nettoyer les images Docker orphelines
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            echo "===================================================="
            echo "🧹 ÉTAPE 6 : Nettoyage du cache et des images obsolètes..."
            docker image prune -f
            echo "✅ Espace disque optimisé."
            echo "===================================================="
